version: "3.8"

services:
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    image: apache/airflow:2.9.3
    container_name: airflow-init
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      # 중요: Airflow 2.9와 호환되는 Kafka Provider 버전 고정 (업그레이드 방지)
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python pyupbit apache-airflow-providers-apache-kafka==1.4.0"
    # entrypoint 오버라이드 삭제 -> 기본 entrypoint가 환경변수 다 잡아줌
    command: bash -c "airflow db migrate && sleep 5 && airflow users create --username admin --firstname Gyeoung --lastname Kim --role Admin --email admin@example.com --password admin || true"
    volumes:
      - ./dags:/opt/airflow/dags
    restart: on-failure

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow-webserver
    depends_on:
      - airflow-init
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__REMOTE_LOGGING: "False"
      # 여기도 동일하게 버전 고정
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python pyupbit apache-airflow-providers-apache-kafka==1.4.0"
    command: bash -c "chown -R airflow:root /opt/airflow/logs && airflow webserver"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs-volume:/opt/airflow/logs
    restart: always

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__REMOTE_LOGGING: "False"
      AIRFLOW__SCHEDULER__PARSE_DAG_ONLY_ON_IMPORT: "True"
      # 여기도 동일하게 버전 고정
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python pyupbit apache-airflow-providers-apache-kafka==1.4.0"
    command: bash -c "chown -R airflow:root /opt/airflow/logs && airflow scheduler"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs-volume:/opt/airflow/logs
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  postgres-db-volume:
  airflow-logs-volume:
